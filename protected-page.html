<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">

<!-- ==== GATE: keep this block FIRST in <head>, before any content ==== -->
<meta name="robots" content="noindex, nofollow">
<script>
  (function () {
    try {
      // unlocked this session, or "Remember me" was ticked (localStorage)
      if (sessionStorage.getItem("unlocked") === "1" ||
          localStorage.getItem("unlocked")   === "1") return;
      // remember the page they wanted, so login can send them back here
      sessionStorage.setItem("returnTo", location.pathname + location.search + location.hash);
    } catch (_) {}
    location.replace("login.html");   // <-- adjust to "../login.html" etc. if this page is in a subfolder
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=login.html"></noscript>
<!-- ==== END GATE ==== -->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected page</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --border:#d0d7de; --accent:#0969da;
  }
  @media (prefers-color-scheme: dark) and (min-width: 99999px) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --border:#30363d; --accent:#4493f8; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
    line-height:1.6;
  }
  main { max-width:720px; margin:0 auto; padding:2.5rem 1.5rem 5rem; }
  h1 { margin-top:0; }
  button {
    font:inherit; padding:0.45rem 0.9rem; border:1px solid var(--border); border-radius:8px;
    background:transparent; color:var(--fg); cursor:pointer;
  }
  button:hover { border-color:var(--accent); color:var(--accent); }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1.5rem; }
  .tag { font-size:0.8rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="bar">
    <span class="tag">🔓 Unlocked for this browser session</span>
    <button id="logout" type="button">Log out</button>
  </div>

  <h1>Protected page</h1>
  <p>Replace this with your real content. Any page that starts with the GATE block
     above (and lists itself in <code>robots.txt</code>) is soft-gated the same way.</p>
</main>

<script>
  document.getElementById("logout").addEventListener("click", function () {
    try {
      sessionStorage.removeItem("unlocked");
      localStorage.removeItem("unlocked");
    } catch (_) {}
    location.replace("login.html");
  });
</script>
</body>
</html>
